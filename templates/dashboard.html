<!-- MODAL REGISTRAR MOVIMIENTO -->
<div class="modal-overlay" id="modalOverlay"></div>

<div class="modal-window" id="movementModal">
    <div class="modal-card">
        <h2>Registrar movimiento</h2>

        <form action="{{ url_for('guardar_movimiento') }}" method="POST" class="modal-form">

            <input type="hidden" name="tipo" id="tipoMovimiento" value="Ingreso">
            <input type="hidden" name="redirect_to" value="dashboard">

            <div class="movement-type-switch">
                <button type="button" id="btnIngreso" class="type-btn income active" onclick="seleccionarTipo('Ingreso')">
                    💵 Ingreso
                </button>

                <button type="button" id="btnGasto" class="type-btn expense" onclick="seleccionarTipo('Gasto')">
                    💸 Gasto
                </button>
            </div>

            <div class="form-group">
                <label for="descripcion">Descripción</label>
                <input 
                    type="text" 
                    id="descripcion" 
                    name="descripcion" 
                    placeholder="Ej: Mercado semanal" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="monto">Monto (COP)</label>
                <input 
                    type="number" 
                    id="monto" 
                    name="monto" 
                    min="1" 
                    step="0.01" 
                    placeholder="0" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" name="categoria" required>
                    <!-- Las categorías se cargan con JavaScript -->
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input 
                    type="date" 
                    id="fecha" 
                    name="fecha" 
                    value="{{ hoy_input }}" 
                    required
                >
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-secondary" id="closeModal">
                    Cancelar
                </button>

                <button type="submit" class="btn-primary">
                    Guardar
                </button>
            </div>

        </form>
    </div>
</div>

<script>
    const openModalBtn = document.getElementById('openModal');
    const closeModalBtn = document.getElementById('closeModal');
    const overlay = document.getElementById('modalOverlay');
    const modal = document.getElementById('movementModal');

    const tipoMovimiento = document.getElementById('tipoMovimiento');
    const categoriaSelect = document.getElementById('categoria');
    const btnIngreso = document.getElementById('btnIngreso');
    const btnGasto = document.getElementById('btnGasto');

    const categoriasIngreso = [
        { value: 'Salario', label: '💼 Salario' },
        { value: 'Freelance', label: '💻 Freelance' },
        { value: 'Ventas', label: '🛒 Ventas' },
        { value: 'Inversiones', label: '📈 Inversiones' },
        { value: 'Otros ingresos', label: '💰 Otros ingresos' }
    ];

    const categoriasGasto = [
        { value: 'Alimentación', label: '🍔 Alimentación' },
        { value: 'Transporte', label: '🚌 Transporte' },
        { value: 'Vivienda', label: '🏠 Vivienda' },
        { value: 'Salud', label: '💊 Salud' },
        { value: 'Educación', label: '📚 Educación' },
        { value: 'Ocio', label: '🎮 Ocio' },
        { value: 'Ropa', label: '👕 Ropa' },
        { value: 'Hogar', label: '🏡 Hogar' },
        { value: 'Servicios', label: '💡 Servicios' },
        { value: 'Otros', label: '📦 Otros' }
    ];

    function cargarCategorias(tipo) {
        categoriaSelect.innerHTML = '';

        const lista = tipo === 'Ingreso' ? categoriasIngreso : categoriasGasto;

        lista.forEach(item => {
            const option = document.createElement('option');
            option.value = item.value;
            option.textContent = item.label;
            categoriaSelect.appendChild(option);
        });
    }

    function seleccionarTipo(tipo) {
        tipoMovimiento.value = tipo;

        if (tipo === 'Ingreso') {
            btnIngreso.classList.add('active');
            btnGasto.classList.remove('active');
        } else {
            btnGasto.classList.add('active');
            btnIngreso.classList.remove('active');
        }

        cargarCategorias(tipo);
    }

    function openModal() {
        overlay.classList.add('show');
        modal.classList.add('show');
        seleccionarTipo('Ingreso');
    }

    function closeModal() {
        overlay.classList.remove('show');
        modal.classList.remove('show');
    }

    if (openModalBtn) {
        openModalBtn.addEventListener('click', openModal);
    }

    if (closeModalBtn) {
        closeModalBtn.addEventListener('click', closeModal);
    }

    if (overlay) {
        overlay.addEventListener('click', closeModal);
    }

    document.addEventListener('DOMContentLoaded', function () {
        seleccionarTipo('Ingreso');
    });
</script>
